<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#111813"/>
  <rect x="20" y="20" width="760" height="410" rx="10" fill="#16221a" stroke="#2b4232" stroke-width="2"/>
  <!-- Underground cave simulation -->
  <path d="M 50 100 Q 200 40 400 90 T 750 120 L 750 400 L 50 400 Z" fill="#1b2a20"/>
