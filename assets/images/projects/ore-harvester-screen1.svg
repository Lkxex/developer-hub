    <rect x="390" y="240" width="14" height="14" rx="2"/>
    <rect x="420" y="210" width="10" height="10" rx="2"/>
    <rect x="380" y="190" width="16" height="16" rx="2"/>
  </g>
  <!-- HUD Hotbar -->
