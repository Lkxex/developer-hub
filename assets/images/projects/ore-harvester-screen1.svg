  <text x="400" y="388" fill="#38ef7d" font-family="monospace" font-size="13" text-anchor="middle">[Vein Mining: AKTİF (8 Blok Kazıldı)]</text>
  <text x="400" y="425" fill="#8b949e" font-family="sans-serif" font-size="13" text-anchor="middle">Ekran Görüntüsü 1: Tek Vuruşta Kazılan Derin Elmas Damarı</text>
</svg>
