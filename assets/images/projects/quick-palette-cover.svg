<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="toolBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#toolBg)"/>
  <!-- Palette color swatches -->
  <g transform="translate(180, 160)">
    <rect x="0" y="0" width="80" height="120" rx="8" fill="#38ef7d"/>
    <rect x="90" y="0" width="80" height="120" rx="8" fill="#00f2fe"/>
    <rect x="180" y="0" width="80" height="120" rx="8" fill="#7928ca"/>
    <rect x="270" y="0" width="80" height="120" rx="8" fill="#ff007f"/>
    <rect x="360" y="0" width="80" height="120" rx="8" fill="#f59e0b"/>
  </g>
  <!-- Eyedropper cursor representation -->
  <circle cx="220" cy="220" r="30" fill="none" stroke="#ffffff" stroke-width="3"/>
  <line x1="220" y1="180" x2="220" y2="260" stroke="#ffffff" stroke-width="2"/>
  <line x1="180" y1="220" x2="260" y2="220" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Title Badge -->
  <rect x="250" y="50" width="300" height="50" rx="8" fill="#0d1117" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="400" y="82" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="1">QUICK PALETTE</text>
  <text x="400" y="380" fill="#38bdf8" font-family="monospace" font-size="13" text-anchor="middle">WINDOWS TRAY COLOR PICKER &amp; PALETTE MANAGER</text>
  <text x="400" y="415" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">v1.1.4 • C# / .NET 8 • WCAG Contrast Checker</text>
</svg>
