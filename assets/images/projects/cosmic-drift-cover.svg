<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="50%" stop-color="#16122d"/>
      <stop offset="100%" stop-color="#2a0845"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Perspective Grid lines -->
  <g stroke="#ff007f" stroke-opacity="0.25" stroke-width="1.5">
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="380" x2="800" y2="380"/>
    <line x1="0" y1="415" x2="800" y2="415"/>
    <line x1="400" y1="280" x2="50" y2="450"/>
    <line x1="400" y1="280" x2="200" y2="450"/>
    <line x1="400" y1="280" x2="350" y2="450"/>
    <line x1="400" y1="280" x2="450" y2="450"/>
    <line x1="400" y1="280" x2="600" y2="450"/>
    <line x1="400" y1="280" x2="750" y2="450"/>
  </g>
  <!-- Sun / Horizon -->
  <circle cx="400" cy="270" r="90" fill="#ff007f" opacity="0.15"/>
  <circle cx="400" cy="270" r="70" fill="#7928ca" opacity="0.3"/>
  <!-- Spacecraft -->
  <polygon points="400,200 435,270 400,255 365,270" fill="url(#cyanGlow)"/>
  <polygon points="400,200 415,255 400,250 385,255" fill="#ffffff" opacity="0.8"/>
  <!-- Thruster flame -->
  <polygon points="392,260 408,260 400,290" fill="#ff007f"/>
  <!-- Title Badge -->
  <rect x="250" y="50" width="300" height="46" rx="8" fill="#0d1117" fill-opacity="0.85" stroke="#ff007f" stroke-width="1.5"/>
  <text x="400" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="2">COSMIC DRIFT</text>
  <text x="400" y="425" fill="#4facfe" font-family="monospace" font-size="13" text-anchor="middle">ARCADE SPACE RACER • GODOT ENGINE</text>
</svg>
