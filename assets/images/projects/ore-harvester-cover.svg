<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c14"/>
      <stop offset="50%" stop-color="#1b281d"/>
      <stop offset="100%" stop-color="#0f1910"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#mcBg)"/>
  <!-- Pixel style blocks -->
  <g fill="#2e3f30" stroke="#1b281d" stroke-width="2">
    <rect x="100" y="280" width="80" height="80" rx="4"/>
    <rect x="180" y="280" width="80" height="80" rx="4"/>
    <rect x="260" y="280" width="80" height="80" rx="4"/>
    <rect x="180" y="200" width="80" height="80" rx="4" fill="#3a523d"/>
    <rect x="260" y="200" width="80" height="80" rx="4" fill="#3a523d"/>
    <rect x="340" y="280" width="80" height="80" rx="4"/>
  </g>
  <!-- Diamond ore sparkles -->
  <rect x="205" y="225" width="30" height="30" fill="#00ffff" opacity="0.9"/>
  <rect x="285" y="225" width="30" height="30" fill="#00ffff" opacity="0.9"/>
  <rect x="205" y="305" width="30" height="30" fill="#00ffff" opacity="0.9"/>
  
  <!-- Pickaxe icon -->
  <g transform="translate(480, 160) rotate(25)">
    <rect x="35" y="40" width="15" height="120" fill="#8B5A2B" rx="2"/>
    <path d="M 0 35 C 20 10, 65 10, 85 35 L 75 45 C 55 25, 30 25, 10 45 Z" fill="#00f2fe"/>
  </g>
  
  <!-- Title Badge -->
  <rect x="220" y="45" width="360" height="50" rx="8" fill="#0d1117" fill-opacity="0.9" stroke="#38ef7d" stroke-width="1.5"/>
  <text x="400" y="77" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="1">ORE HARVESTER MOD</text>
  <text x="400" y="415" fill="#38ef7d" font-family="monospace" font-size="13" text-anchor="middle">MINECRAFT 1.21.x • FABRIC &amp; NEOFORGE</text>
</svg>
